name: Tests (Coverage)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-cov:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.70.1
          cache: true

      - name: Run tests with coverage
        run: pixi run --environment default pytest --cov=fewspy --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

  package-tests:
    name: Package (Python ${{ matrix.python-version }}, ${{ matrix.dependencies }})
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        dependencies: [latest]
        include:
          - python-version: "3.10"
            dependencies: minimum-pydantic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/package-venv"
          echo "$RUNNER_TEMP/package-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/package-venv/bin/python" -m pip install --upgrade pip

      - name: Constrain declared minimum Pydantic version
        if: ${{ matrix.dependencies == 'minimum-pydantic' }}
        shell: bash
        run: |
          echo 'pydantic==2.0' > "$RUNNER_TEMP/minimum-dependencies.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/minimum-dependencies.txt" >> "$GITHUB_ENV"

      - name: Install and check package dependencies
        run: |
          python -m pip install ".[tests]"
          python -m pip check

      - name: Test installed package outside the source tree
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests"
