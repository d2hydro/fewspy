[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "fewspy"
description = "A Python API for the Deltares FEWS PI REST Web Service"
readme = "README.md"
authors = [
    { name = "Daniel Tollenaar", email = "daniel@d2hydro.nl" },
]
license = { text = "MIT" }

requires-python = ">=3.10,<3.15"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiohttp",
    "lxml",
    "nest-asyncio; python_version < '3.14'",
    "nest-asyncio2>=1.7.2; python_version >= '3.14'",
    "numpy",
    "pandas",
    "pyarrow",
    "pydantic>=2",
    "geopandas",
    "requests",
    "shapely",
    "typing-extensions",
    "urllib3",
    "netCDF4",
    "xarray"
    ]

dynamic = ["version"]

[project.optional-dependencies]
tests = ["pytest"]

[tool.flake8]
max-line-length = 120
max-complexity = 10

[tool.hatch.version]
source = "vcs"
tag-pattern = '^v?(?P<version>\d{4}\.\d{1,2}\.\d+(?:(?:a|b|rc)\d+)?(?:\.post\d+)?(?:\.dev\d+)?)$'

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

[project.urls]
Source = "https://github.com/d2hydro/fewspy"
