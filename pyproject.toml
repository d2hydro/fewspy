[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "fewspy"
description = "A Python API for the Deltares FEWS PI REST Web Service"
readme = "README.md"
authors = [
    { name = "Daniel Tollenaar", email = "daniel@d2hydro.nl" },
]
license = { text = "MIT" }

requires-python = ">=3.10,<3.15"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiohttp",
    "lxml",
    "nest-asyncio; python_version < '3.14'",
    "nest-asyncio2>=1.7.2; python_version >= '3.14'",
    "numpy",
    "pandas",
    "pyarrow",
    "pydantic>=2",
    "geopandas",
    "requests",
    "shapely",
    "typing-extensions",
    "urllib3",
    "netCDF4",
    "xarray"
    ]

dynamic = ["version"]

[project.optional-dependencies]
tests = ["pytest"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".pixi", ".tmp"]

[tool.ruff.lint]
# Targeting fewspy's oldest supported Python.
select = [
    "B", "C4", "D", "E", "F", "FURB", "I", "LOG", "NPY", "PD",
    "PERF", "PTH", "RUF", "S", "SIM", "UP", "PLC0415",
]
ignore = [
    "D1", "D400", "D401", "E501",
    "PD002", "PD003", "PD008", "PD009", "PD010", "PD011", "PD013", "PD015",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.hatch.version]
source = "vcs"
tag-pattern = '^v?(?P<version>\d{4}\.\d{1,2}\.\d+(?:(?:a|b|rc)\d+)?(?:\.post\d+)?(?:\.dev\d+)?)$'

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

[project.urls]
Source = "https://github.com/d2hydro/fewspy"
